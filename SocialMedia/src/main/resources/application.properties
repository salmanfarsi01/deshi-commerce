spring.application.name=SocialMedia
server.port=8080

# ===================================================================
# POSTGRESQL & JPA PERSISTENCE LAYER (SUPABASE)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.egrsdpmqeyzcauqrcewq}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin@123@faah}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false


# ===================================================================
# PRODUCTION HARDENING: SECRET MANAGEMENT & SECURITY PROFILES
# Overridable via OS Environment Variables in Production (e.g. Docker/Kubernetes)
# ===================================================================
app.jwt.secret=${JWT_SECRET:DeshiCommerceSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHMACSHA256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Rate Limiting Configuration
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.default-rpm=${RATE_LIMIT_DEFAULT_RPM:60}
app.security.rate-limit.auth-rpm=${RATE_LIMIT_AUTH_RPM:15}

# Brute-Force Login Protection
app.security.brute-force.max-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.brute-force.lockout-minutes=${LOCKOUT_MINUTES:15}

# Multi-Tenant Isolation Defaults
app.security.tenant.default=${DEFAULT_TENANT_ID:main-store}
app.security.tenant.header-name=X-Tenant-ID

# Production HTTPS & Cookie Security (Enable when deploying with SSL certificate)
# server.ssl.key-store=${SSL_KEYSTORE_PATH:classpath:keystore.p12}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
# server.ssl.key-store-type=PKCS12
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

# ===================================================================
# BANGLADESH DELIVERY CONFIGURATION
# ===================================================================
app.delivery.charge-inside-dhaka=${DELIVERY_CHARGE_INSIDE_DHAKA:60}
app.delivery.charge-outside-dhaka=${DELIVERY_CHARGE_OUTSIDE_DHAKA:120}
app.delivery.free-shipping-threshold=${FREE_SHIPPING_THRESHOLD:5000}

# ===================================================================
# SSLCOMMERZ PAYMENT GATEWAY CONFIGURATION
# ===================================================================
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:testbox}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:qwerty}
sslcommerz.is-sandbox=${SSLCOMMERZ_IS_SANDBOX:true}
sslcommerz.success-url=${SSLCOMMERZ_SUCCESS_URL:http://localhost:8080/api/v1/payments/sslcommerz/success}
sslcommerz.fail-url=${SSLCOMMERZ_FAIL_URL:http://localhost:8080/api/v1/payments/sslcommerz/fail}
sslcommerz.cancel-url=${SSLCOMMERZ_CANCEL_URL:http://localhost:8080/api/v1/payments/sslcommerz/cancel}
sslcommerz.ipn-url=${SSLCOMMERZ_IPN_URL:http://localhost:8080/api/v1/payments/sslcommerz/ipn}

# ===================================================================
# BANGLADESH SMS & EMAIL NOTIFICATION CONFIGURATION
# ===================================================================
app.notification.sms.enabled=${SMS_ENABLED:true}
app.notification.sms.sender-id=${SMS_SENDER_ID:DESHI_COMM}
app.notification.sms.provider=${SMS_PROVIDER:sandbox}
app.notification.sms.api-token=${SMS_API_TOKEN:sandbox-sms-token}

app.notification.email.enabled=${EMAIL_ENABLED:true}
app.notification.email.from-address=${EMAIL_FROM:no-reply@deshicommerce.com.bd}
app.notification.email.from-name=${EMAIL_FROM_NAME:Deshi Commerce}

# ===================================================================
# MULTIPART FILE UPLOAD CONFIGURATION
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB


